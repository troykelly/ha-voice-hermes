# SPDX-License-Identifier: MIT
# Clone-local/operator-owned configuration. Dashboard-adopted users normally
# add the same substitutions to the YAML generated by ESPHome Device Builder.
substitutions:
  name: hermes-voice-pe
  friendly_name: Hermes Voice PE
  # Empty uses the stable hardware-derived voice-pe-<wifi-mac> identity.
  device_id: ""
  wake_word_model_manifest: models/okay_nabu.json
  vad_model_manifest: models/vad.json
  hermes_gateway_url: !secret hermes_gateway_url
  hermes_device_token: !secret hermes_device_token
  ota_password: !secret ota_password

packages:
  hermes_voice_pe_base: !include packages/hermes-voice-pe-base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [hermes_voice]

esphome:
  build_path: build/hermes-voice-pe-local

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key
