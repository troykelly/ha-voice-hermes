# Used only by hermes-voice-pe.local.yaml or copied into the adopter-owned
# ESPHome Device Builder secrets file. The universal factory/public package
# contains no !secret references and must adopt successfully without these.
wifi_ssid: "REPLACE_ME"
wifi_password: "REPLACE_ME"
ota_password: "REPLACE_ME"

# Generate a unique 32-byte base64 key, for example with:
#   openssl rand -base64 32
# This deliberately invalid value prevents an accidental example deployment.
api_encryption_key: "REPLACE_ME_WITH_OPENSSL_OUTPUT"

# The device gets only the Worker route and its own bearer. Hermes, ElevenLabs,
# and Cloudflare Access credentials remain Worker-side.
# Deployed Cloudflare realtime WebSocket route, including the v2 API path.
hermes_gateway_url: "REPLACE_ME_WITH_WSS_URL"

# Must equal the device's entry in the Worker's DEVICE_TOKENS_JSON secret, or
# its shared DEVICE_AUTH_TOKEN. Prefer a unique random token for every unit.
hermes_device_token: "REPLACE_ME"
