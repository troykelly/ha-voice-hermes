[package]
name = "ha-voice-hermes-gateway"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Cloudflare Workers voice gateway for Home Assistant Voice PE and Hermes Agent"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
futures-channel = "0.3"
futures-util = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
worker = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
