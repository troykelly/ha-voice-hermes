---
name: Home Assistant Voice Hermes Gateway
version: "0.1.0"
slug: ha_voice_hermes_gateway
description: >-
  Local realtime Voice Preview Edition gateway for Hermes Agent and ElevenLabs
url: >-
  https://github.com/troykelly/ha-voice-hermes/tree/main/ha_voice_hermes_gateway
arch:
  - aarch64
  - amd64
homeassistant: 2026.7.0
init: false
stage: experimental
image: ghcr.io/troykelly/ha-voice-hermes-gateway
tmpfs: true
backup: cold
map:
  - type: ssl
    read_only: true
ports:
  8443/tcp: 8443
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  certificate_poll_seconds: 60
  allow_private_upstreams: false
  hermes_base_url: null
  hermes_api_key: null
  hermes_model: hermes-agent
  hermes_profile_id: voice-safe
  hermes_binding_revision: v1
  elevenlabs_api_key: null
  elevenlabs_voice_id: null
  realtime_stt_model: scribe_v2_realtime
  tts_model: eleven_flash_v2_5
  elevenlabs_enable_logging: true
  conversation_idle_seconds: 900
  realtime_max_audio_seconds: 30
  realtime_max_output_seconds: 30
  max_connection_audio_seconds: 900
  max_turns_per_connection: 256
  max_messages_per_connection: 16384
  diagnostic_v1_enabled: false
  devices: null
schema:
  certfile: match(^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$)
  keyfile: match(^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$)
  certificate_poll_seconds: int(5,3600)
  allow_private_upstreams: bool
  hermes_base_url: url
  hermes_api_key: password
  hermes_model: match(^[A-Za-z0-9._/:@-]{1,160}$)
  hermes_profile_id: match(^[A-Za-z0-9._/:@-]{1,160}$)
  hermes_binding_revision: match(^[A-Za-z0-9._/:@-]{1,160}$)
  hermes_voice_instructions: password?
  cf_access_client_id: password?
  cf_access_client_secret: password?
  elevenlabs_api_key: password
  elevenlabs_voice_id: str
  realtime_stt_model: match(^[A-Za-z0-9._/:@-]{1,160}$)
  tts_model: match(^[A-Za-z0-9._/:@-]{1,160}$)
  elevenlabs_enable_logging: bool
  stt_language_code: match(^[A-Za-z]{2,3}(-[A-Za-z]{2,4})?$)?
  conversation_idle_seconds: int(60,31536000)
  realtime_max_audio_seconds: int(1,30)
  realtime_max_output_seconds: int(1,30)
  max_connection_audio_seconds: int(30,86400)
  max_turns_per_connection: int(1,10000)
  max_messages_per_connection: int(128,1000000)
  diagnostic_v1_enabled: bool
  devices:
    - device_id: match(^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$)
      device_token: password
      hermes_session_key: password
